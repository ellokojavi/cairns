<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1C2A2E">
<link rel="apple-touch-icon" href="./cairns-apple-180.png">
<link rel="icon" type="image/png" href="./favicon.png">
<title>Cairns</title>
<script>
// links from the Enchantments-only version carried the plan in the hash: send them to that route
if(/(^|[#&])(d|c0)=/.test(location.hash))location.replace('planner.html?r=enchantments'+location.hash);
</script>
<script src="units.js"></script>
<script src="routes/catalog.js"></script>
<script src="tags.js"></script>
<style>
:root{
  --bg:#E9ECE8; --panel:#F6F7F4; --ink:#1C2A2E; --muted:#5E6B67; --rule:#C9CFCA; --ok:#3C7A4E; --warn:#A86C12; --accent:#B0432A;
  --cond:"Avenir Next Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="dark"]{--bg:#12191B; --panel:#1A2326; --ink:#E4EAE6; --muted:#93A09B; --rule:#2E3A3D; --ok:#6DBB83; --warn:#E3A94B; --accent:#E77C64}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#12191B; --panel:#1A2326; --ink:#E4EAE6; --muted:#93A09B; --rule:#2E3A3D; --ok:#6DBB83; --warn:#E3A94B; --accent:#E77C64}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
h1{font:600 30px/1.05 var(--cond);margin:4px 0 2px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:56px;height:56px;object-fit:contain;}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.brand .sub{white-space:nowrap}
@media (max-width:380px){.brand{gap:9px}.brand .sub{font-size:12.5px}}
.units{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.units button{background:none;border:0;padding:5px 9px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer}
.units button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.units button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hctl{display:flex;align-items:center;gap:8px}
.ghost{background:none;border:1px solid var(--rule);border-radius:6px;padding:5px 10px;color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
.fine{color:var(--muted);font-size:13px;margin-top:22px;border-top:1px solid var(--rule);padding-top:12px}
/* the map: drag to pan, pinch / wheel / double-tap to zoom; drawn with one transform */
.ovmap{position:relative;overflow:hidden;aspect-ratio:16/9;max-width:100%;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:#A8C8DE;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;cursor:grab}
.ovmap.drag{cursor:grabbing}
.ovin{position:absolute;left:0;top:0;width:100%;transform-origin:0 0;will-change:transform}
.ovin img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
:root[data-theme="dark"] .ovin img{filter:brightness(.72) saturate(.85)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ovin img{filter:brightness(.72) saturate(.85)}}
.ovin svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ovpl{font:600 13px var(--body);fill:var(--ink);stroke:var(--panel);paint-order:stroke;pointer-events:none}
.ovdot{cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.ovdot:focus-visible circle{stroke:var(--ink);stroke-width:3}
.ovdot circle{stroke:#fff}
.ovdot.easy circle{fill:#3C7A4E}.ovdot.medium circle{fill:#B07A12}.ovdot.hard circle{fill:#B0432A}.ovdot.mixed circle{fill:#1C2A2E}
.ovdot.sel circle{stroke:var(--ink)}
.ovdot text{font-family:var(--body);font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.ovdot .nm{font-family:var(--cond);font-weight:600;fill:var(--ink);stroke:var(--panel);paint-order:stroke;text-anchor:start}
.ovbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 12px;padding:8px 12px;font-size:13px;color:var(--muted)}
.lgd{display:flex;gap:10px}
.lgd i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.lgd .easy{background:#3C7A4E}.lgd .medium{background:#B07A12}.lgd .hard{background:#B0432A}
.ovhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 12px 8px;font-size:13px;color:var(--muted)}
.ovhead b{color:var(--ink);font-weight:600}
.ovhead button{background:none;border:0;padding:2px 0;font:600 13px var(--body);color:var(--accent);cursor:pointer;white-space:nowrap}
/* header: as before, with more air around it */
header{margin-bottom:14px;padding-top:4px}
.hctl{gap:10px}
/* offline status: a small chip; it grows into a message only when something needs attention */
.off{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:3px 11px;margin:0 0 16px;background:var(--panel)}
.off.ready{color:var(--ok);border-color:var(--ok)}
.off.no{display:block;border-radius:10px;padding:9px 12px;color:var(--ink);border-color:var(--warn);font-size:14px}
.find h2{font:600 22px/1.15 var(--cond);margin:0 0 10px}
/* filter chips: each opens a sheet; an active one shows its choice and an ✕ */
.facets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px 1px 2px;margin:0 -1px}
.facets::-webkit-scrollbar{display:none}
.fc{flex:0 0 auto;font:600 13.5px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.fc span{color:var(--muted)}
.fc.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.fc.on span{color:inherit;opacity:.8}
.fc:focus-visible,.opt:focus-visible,.showb:focus-visible,.linkb:focus-visible,.seg button:focus-visible,.hk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fbar{display:flex;align-items:center;gap:12px;margin:12px 0 10px;font-size:13.5px;color:var(--muted)}
.fbar #fcount{font-weight:600;color:var(--ink)}
.linkb{background:none;border:0;padding:2px 0;font:600 13.5px var(--body);color:var(--accent);cursor:pointer}
.seg{margin-left:auto;display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px;font:600 13px var(--body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#mapview{background:var(--panel);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin:0 0 10px}
#mapview .ovmap{border-top:0;aspect-ratio:7/5}   /* in Map view the map leads: tall enough for a dot's card, wide enough for every trailhead */
.ovhead{padding-top:0}
/* one row per hike */
.rows{display:flex;flex-direction:column;gap:8px}
.hk{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--rule);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;min-height:84px}
.hk .th{position:relative;align-self:stretch;background:#1C2A2E}
.hk .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.hk .th i{position:absolute;left:7px;top:7px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.hk .th i.easy{background:#4E9A63}.hk .th i.medium{background:#D49A22}.hk .th i.hard{background:#D2563A}
.hk .tx{min-width:0;padding:9px 0}
.hk b{display:block;font:600 18px/1.12 var(--cond)}
.hk .s .nw{white-space:nowrap}
.hk .s{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.hk .tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.hk .tg span{font-size:11px;line-height:1.5;border:1px solid var(--rule);border-radius:999px;padding:0 7px;color:var(--muted)}
.hk .tg .dn{color:var(--ok);border-color:var(--ok)}
.hk .chev{padding-right:12px;color:var(--muted);font-size:22px}
.ovpop{position:absolute;z-index:3;background:var(--panel);border:1px solid var(--rule);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.28);overflow:auto;cursor:auto;touch-action:pan-y}
.poph{display:flex;justify-content:space-between;align-items:center;padding:7px 10px 5px;font-size:12.5px;color:var(--muted)}
.poph b{font-weight:600}
.popx{background:none;border:0;font-size:15px;color:var(--muted);cursor:pointer;padding:2px 4px}
.poprow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:7px 10px;border-top:1px solid var(--rule);color:inherit;text-decoration:none}
.poprow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pth{position:relative;width:52px;height:40px;border-radius:6px;overflow:hidden;background:#1C2A2E}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pth i{position:absolute;left:4px;top:4px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1.5px #fff}
.pth i.easy{background:#4E9A63}.pth i.medium{background:#D49A22}.pth i.hard{background:#D2563A}
.ptx{min-width:0}.ptx b{display:block;font:600 15.5px/1.15 var(--cond)}
.ptx span{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.poprow .chev{color:var(--muted);font-size:20px}
.none{background:var(--panel);border:1px dashed var(--rule);border-radius:12px;padding:18px 14px;margin:0;color:var(--muted);text-align:center}
/* the filter sheet */
.sheetbg{position:fixed;inset:0;background:rgba(10,16,18,.42);z-index:20}
.fsheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--panel);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;max-height:80vh;overflow:auto}
.grab{width:38px;height:4px;border-radius:2px;background:var(--rule);align-self:center;margin:2px 0 8px}
.shh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.shh b{font:600 20px var(--cond)}
.shg{margin:10px 0 2px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;border-top:1px solid var(--rule);padding:12px 2px;font:15px var(--body);color:var(--ink);cursor:pointer;text-align:left}
.opt small{color:var(--muted);font-size:12.5px;margin-left:4px}
.opt b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{font-weight:600}.opt[aria-pressed="true"] b{color:var(--accent)}
.opt:disabled{opacity:.4;cursor:default}
.showb{margin-top:12px;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:13px;font:700 15px var(--body);cursor:pointer}
.credit{margin-top:24px;padding-top:12px;border-top:1px solid var(--rule);color:var(--muted);font-size:12.5px;text-align:center}
.credit a{color:inherit}
/* the logo in light ink on dark backgrounds */
.lg-dark{display:none}
.logo.lg-dark{width:77px;height:77px;margin:-10.5px}/* logo-dark.png has a 48px shadow margin on a 256px logo: scale 352/256 so the stones match */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-light{display:none}:root:not([data-theme="light"]) .lg-dark{display:inline}}
:root[data-theme="dark"] .lg-light{display:none}:root[data-theme="dark"] .lg-dark{display:inline}
</style>
</head>
<body>
<main>
<header>
  <div class="brand"><img class="logo lg-light" src="logo.png" alt="" width="56" height="56"><img class="logo lg-dark" src="logo-dark.png" alt="" width="56" height="56"><div><h1>Cairns</h1><p class="sub" style="margin:0">Offline Hike Planner</p></div></div>
  <div class="hctl" id="hctl"><button class="ghost" id="theme" type="button">Dark</button></div>
</header>
<div id="off" class="off">Checking offline copy…</div>
<section class="find" aria-labelledby="findh">
  <h2 id="findh">Find and track your next hike</h2>
  <div class="facets" id="facets" role="group" aria-label="Filters"></div>
  <div class="fbar"><span id="fcount" aria-live="polite"></span><button type="button" class="linkb" id="fclear" hidden>Clear filters</button>
    <span class="seg" id="viewsw" role="group" aria-label="View"><button type="button" data-v="list">List</button><button type="button" data-v="map">Map</button></span></div>
  <div id="mapview" hidden>
    <div class="ovmap" id="ovmap"><div class="ovin" id="ovin"><img id="ovimg" alt="Relief map of the region from Puget Sound to Leavenworth, with a dot at each trailhead" draggable="false"><svg id="ovsvg" role="group" aria-label="Trailheads"></svg></div>
      <div class="ovpop" id="ovpop" role="dialog" aria-label="Hikes at this trailhead" hidden></div>
      <div class="ovctl"><button id="ovplus" type="button" aria-label="Zoom in">+</button><button id="ovminus" type="button" aria-label="Zoom out">−</button><button id="ovreset" type="button" aria-label="Reset the view">ALL</button></div></div>
    <div class="ovbar"><span id="ovhint">Tap a dot for the hikes that start there.</span><span class="lgd"><span><i class="easy"></i>Easy</span><span><i class="medium"></i>Medium</span><span><i class="hard"></i>Hard</span></span></div>
    <div class="ovhead" id="ovhead" hidden></div>
  </div>
  <div class="rows" id="rows"></div>
</section>
<div class="sheetbg" id="sheetbg" hidden></div>
<div class="fsheet" id="fsheet" role="dialog" aria-modal="true" aria-labelledby="fsh" hidden></div>
<footer class="credit">© 2026 · by El Loko Javi · <a href="https://github.com/ellokojavi/cairns" target="_blank" rel="noopener">GitHub</a></footer>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const dur=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
const n=v=>v.toLocaleString('en-US');
// one tap: Google Maps opens with driving directions to the parking (the app on a phone)
const gmaps=g=>'https://www.google.com/maps/dir/?api=1&destination='+g[0]+','+g[1]+'&travelmode=driving';
// a hike's name: "Peak — Route" where a peak has several routes, so every card and list says the same
const hikeName=h=>HIKES.filter(x=>x.peak===h.peak).length>1?h.title+' — '+h.variant:h.title;
// the town a hike starts from, from its place line: "Mount Si NRCA, North Bend, WA" -> "North Bend"
const town=h=>{const p=h.place.split(',').map(x=>x.trim());return(p[p.length-2]||p[0]).replace(/^near /,'')};
const hrs=m=>Math.floor(m/60)+'\u00a0h'+(m%60?'\u00a0'+String(m%60).padStart(2,'0'):'');   // never split "6 h 35" across lines
// one row per hike: thumbnail with the difficulty dot, name, the numbers, two tags at most. The row opens the planner.
function row(h){
  const pick=id=>FILTERS.find(f=>f.id===id).opts.find(o=>o[2](h)),dist=pick('dist'),d=DIFF(h);
  const tags=[dist&&(dist[0]==='medium'?'Mid-length':dist[1]),...FILTERS.find(f=>f.id==='hl').opts.filter(o=>o[2](h)).map(o=>o[1])].filter(Boolean).slice(0,2);
  return `<a class="hk" href="planner.html?r=${h.id}"><span class="th"><img src="${h.cover}" alt="" loading="lazy"><i class="${d}" title="${DIFF_NAME[d]}"></i></span>
    <span class="tx"><b>${hikeName(h)}</b><span class="s">${[town(h),U.dist(h.km*1000),'+'+U.elev(h.up),hrs(h.moving+h.breaks)].map(x=>`<span class="nw">${x}</span>`).join(' · ')}</span>
    <span class="tg"><span>${DIFF_NAME[d]}</span>${tags.map(t=>`<span>${t}</span>`).join('')}${h.done?'<span class="dn">✓ Walked</span>':''}</span></span><span class="chev" aria-hidden="true">›</span></a>`;
}
// the rows: every match, or in Map view after a tap on a dot, that trailhead's hikes only
let rowSig='';
function renderRows(){
  const all=HIKES.filter(h=>passes(h)),any=FILTERS.some(f=>(FSEL[f.id]||[]).length);
  const sel=null,hs=all;   // a tapped dot opens its card on the map (ovPop); the rows keep every match
  $('fcount').textContent=any?`${all.length} of ${HIKES.length} hikes`:`${HIKES.length} hikes`;
  $('fclear').hidden=!any;
  const oh=$('ovhead');oh.hidden=!sel;
  if(sel)oh.innerHTML=`<span><b>${sel.length} ${sel.length===1?'hike':'hikes'} at this trailhead</b></span><button type="button" class="linkb" id="ovall">Show all ${all.length}</button>`;
  $('ovhint').textContent=sel?'Tap a row to plan it.':'Tap a dot for the hikes that start there.';
  const sig=hs.map(h=>h.id).join()+U.us+any;if(sig===rowSig)return;rowSig=sig;   // the map redraws on every zoom step: rebuild only on change
  $('rows').innerHTML=hs.length?hs.map(row).join(''):'<p class="none">No hike matches all the filters. <button type="button" class="linkb" data-clear>Clear filters</button></p>';
}
$('rows').addEventListener('click',e=>{if(e.target.closest('[data-clear]')){FSEL={};applyFilters()}});
$('ovhead').addEventListener('click',e=>{if(e.target.id==='ovall'){ovSel=null;renderRows();ovDraw()}});

// ---------- filters: pills in a row are alternatives (OR), rows narrow each other (AND) ----------

let FSEL={};try{FSEL=JSON.parse(localStorage.getItem('cairns-filters')||'{}')||{}}catch(e){}
const passes=(h,skip)=>FILTERS.every(f=>f.id===skip||!(FSEL[f.id]||[]).length||f.opts.some(o=>FSEL[f.id].includes(o[0])&&o[2](h)));
// four chips; each opens a sheet with its options and how many hikes each would leave
const FACETS=[['dist','Distance',['dist']],['diff','Difficulty',['diff']],['time','Time',['time']],['more','More',['pass','hl']]];
const fopt=(g,id)=>FILTERS.find(f=>f.id===g).opts.find(o=>o[0]===id);
function drawFacets(){
  $('facets').innerHTML=FACETS.map(([id,name,gs])=>{const on=gs.flatMap(g=>(FSEL[g]||[]).map(o=>fopt(g,o)[1]));
    return `<button type="button" class="fc${on.length?' on':''}" data-facet="${id}" aria-haspopup="dialog">${on.length?on[0]+(on.length>1?' +'+(on.length-1):''):name}<span aria-hidden="true">${on.length?' ✕':' ▾'}</span></button>`}).join('');
}
let SHEET=null;
function drawSheet(){
  const [id,name,gs]=FACETS.find(f=>f[0]===SHEET),n=HIKES.filter(h=>passes(h)).length;
  $('fsheet').innerHTML=`<div class="grab" aria-hidden="true"></div><div class="shh"><b id="fsh">${name}</b><button type="button" class="linkb" data-sclear>Clear</button></div>`
    +gs.map(g=>{const f=FILTERS.find(x=>x.id===g);return(gs.length>1?`<p class="shg">${f.name}</p>`:'')+f.opts.map(o=>{
      const on=(FSEL[g]||[]).includes(o[0]),cnt=HIKES.filter(h=>passes(h,g)&&o[2](h)).length;
      return `<button type="button" class="opt" data-g="${g}" data-o="${o[0]}" aria-pressed="${on}"${!on&&!cnt?' disabled':''}><span>${on?'✓ ':''}${o[1]}${o[3]?` <small>${o[3]()}</small>`:''}</span><b>${cnt}</b></button>`}).join('')}).join('')
    +`<button type="button" class="showb" data-sclose>${n?`Show ${n} ${n===1?'hike':'hikes'}`:'No hikes match'}</button>`;
}
function openSheet(id){SHEET=id;drawSheet();$('fsheet').hidden=$('sheetbg').hidden=false;$('fsheet').querySelector('.opt')?.focus()}
function closeSheet(){if(!SHEET)return;const id=SHEET;SHEET=null;$('fsheet').hidden=$('sheetbg').hidden=true;$('facets').querySelector(`[data-facet="${id}"]`)?.focus()}
$('facets').addEventListener('click',e=>{const b=e.target.closest('[data-facet]');if(!b)return;
  const gs=FACETS.find(f=>f[0]===b.dataset.facet)[2];
  if(e.target.closest('span')&&gs.some(g=>(FSEL[g]||[]).length)){gs.forEach(g=>delete FSEL[g]);applyFilters();return}   // the ✕ clears that chip
  openSheet(b.dataset.facet)});
$('fsheet').addEventListener('click',e=>{
  if(e.target.closest('[data-sclose]'))return closeSheet();
  if(e.target.closest('[data-sclear]')){FACETS.find(f=>f[0]===SHEET)[2].forEach(g=>delete FSEL[g]);applyFilters();return}
  const b=e.target.closest('.opt');if(!b||b.disabled)return;
  const l=FSEL[b.dataset.g]=FSEL[b.dataset.g]||[],i=l.indexOf(b.dataset.o);i<0?l.push(b.dataset.o):l.splice(i,1);applyFilters()});
$('sheetbg').addEventListener('click',closeSheet);
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('fclear').addEventListener('click',()=>{FSEL={};applyFilters()});
function applyFilters(){
  try{localStorage.setItem('cairns-filters',JSON.stringify(FSEL))}catch(e){}
  drawFacets();if(SHEET)drawSheet();
  ovSel=null;renderRows();
  if(VMODE==='map'){ovDraw();ovFit()}   // a new filter shows all its matches, framed on the map
}
// List or Map: one at a time, remembered
let VMODE='list',ovReady=false;try{if(localStorage.getItem('cairns-view')==='map')VMODE='map'}catch(e){}
function setView(v){
  VMODE=v;try{localStorage.setItem('cairns-view',v)}catch(e){}
  $('viewsw').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));
  $('mapview').hidden=v!=='map';
  if(v==='map'&&$('ovimg').complete&&OVM.clientWidth){if(!ovReady){[VIEW.z,VIEW.x,VIEW.y]=ovHome();ovReady=true}ovApply();ovDraw()}
  if(v!=='map')ovSel=null;
  rowSig='';renderRows();
}
$('viewsw').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b&&b.dataset.v!==VMODE)setView(b.dataset.v)});

// ---------- overview map: a dot per trailhead; dots too close to tell apart on screen merge ----------
const OV=OVERVIEW,OVM=$('ovmap'),OVI=$('ovin');
const ovXY=(lon,lat)=>[(lon-OV.w)/(OV.e-OV.w)*OV.W,(OV.n-lat)/(OV.n-OV.s)*OV.H];
let ovSel=null;
const VIEW={z:1,x:0,y:0},ZMAX=14;   // zoom (1 = the map's width fits the box) and pan offset in screen px
// the box is taller than the map is wide: the least zoom fills it, and the home view centres on the hikes
const zMin=()=>Math.max(1,OVM.clientHeight/(OVM.clientWidth*OV.H/OV.W));
function ovHome(){const z=zMin(),w=OVM.clientWidth,xs=HIKES.filter(h=>h.go).map(h=>ovXY(h.go[1],h.go[0])).concat([ovXY(OV.places[0][1],OV.places[0][2])]);   // the hikes and Seattle
  const cx=(Math.min(...xs.map(p=>p[0]))+Math.max(...xs.map(p=>p[0])))/2,cy=(Math.min(...xs.map(p=>p[1]))+Math.max(...xs.map(p=>p[1])))/2,k=w*z/OV.W;
  return[z,w/2-cx*k,OVM.clientHeight/2-cy*k]}
function ovDraw(){
  const svg=$('ovsvg'),k=OVM.clientWidth*VIEW.z/OV.W||.1;   // screen px per map px
  svg.setAttribute('viewBox',`0 0 ${OV.W} ${OV.H}`);
  const u=v=>(v/k).toFixed(1);   // a size in screen px, in map units
  // one point per trailhead, then merge the closest pair while any two are under ~26 px apart on screen
  const pts=[];HIKES.filter(h=>h.go&&passes(h)).forEach(h=>{const[x,y]=ovXY(h.go[1],h.go[0]);let p=pts.find(p=>Math.hypot(p.x-x,p.y-y)<1);if(!p)pts.push(p={x,y,hs:[]});p.hs.push(h)});
  const cl=pts.map(p=>({x:p.x,y:p.y,hs:p.hs.slice()}));
  for(;;){let best=null;
    for(let i=0;i<cl.length;i++)for(let j=i+1;j<cl.length;j++){const d=Math.hypot(cl[i].x-cl[j].x,cl[i].y-cl[j].y)*k;if(d<26&&(!best||d<best[0]))best=[d,i,j]}
    if(!best)break;const[,i,j]=best,a=cl[i],c=cl[j],nn=a.hs.length+c.hs.length;
    a.x=(a.x*a.hs.length+c.x*c.hs.length)/nn;a.y=(a.y*a.hs.length+c.y*c.hs.length)/nn;a.hs.push(...c.hs);cl.splice(j,1)}
  const named=k>.12;
  cl.forEach(c=>{const pk=[...new Set(c.hs.map(h=>h.peak))];c.name=pk.length>2?`${pk[0]} +${pk.length-1} more`:pk.join(', ')});
  // towns: the small ones only when zoomed in; a name that would sit on a dot or its label moves below it
  const places=OV.places.filter(p=>!p[3]||k>.12).map(([t,lo,la])=>{const[x,y]=ovXY(lo,la),tw=t.length*3.5;
    const near=cl.some(c=>{const nw=named?c.name.length*7+12:0;return (x-c.x)*k<12+nw+tw&&(c.x-x)*k<12+tw&&Math.abs(c.y-y)*k<16}),yy=near?y+22/k:y;
    return `<text class="ovpl" x="${x}" y="${yy}" style="font-size:${u(12)}px;stroke-width:${u(3.5)}px" text-anchor="middle">${t}</text>`}).join('');
  const dots=cl.map(c=>{const ds=[...new Set(c.hs.map(DIFF))],cls=ds.length>1?'mixed':ds[0];
    const key=c.hs.map(h=>h.id).join(','),r=c.hs.length>1?11:8,sel=ovSel===key;
    return `<g class="ovdot ${cls}${sel?' sel':''}" data-k="${key}" tabindex="0" role="button" aria-label="${c.name}: ${c.hs.length} hike${c.hs.length>1?'s':''}">
      <circle cx="${c.x}" cy="${c.y}" r="${u(r+(sel?2:0))}" style="stroke-width:${u(sel?3.5:2.5)}px"></circle>${c.hs.length>1?`<text x="${c.x}" y="${c.y}" style="font-size:${u(12)}px">${c.hs.length}</text>`:''}
      ${named?(()=>{const sx=c.x*k+VIEW.x,left=sx+r+5+c.name.length*7>OVM.clientWidth-50;   // near the right edge (and the buttons): name on the left
        return `<text class="nm" x="${c.x+(left?-(r+5):r+5)/k}" y="${c.y}" style="font-size:${u(13)}px;stroke-width:${u(3.5)}px${left?';text-anchor:end':''}">${c.name}</text>`})():''}</g>`}).join('');
  svg.innerHTML=places+dots;
  // the picked dot may have merged or split after a zoom: keep showing its hikes if any are still on the map
  if(ovSel){const g=[...svg.querySelectorAll('.ovdot')].find(g=>g.dataset.k.split(',').some(id=>ovSel.split(',').includes(id)));
    if(g){ovSel=g.dataset.k;ovPick(ovSel)}else ovPick(null)}else ovPick(null);
}
function ovPick(key){ovSel=key;ovPop()}
// the card that opens at a tapped dot: one hike, or every hike a numbered dot stands for, each a tap from its page
let popSig='';
function ovPop(){
  const box=$('ovpop'),g=ovSel&&[...$('ovsvg').querySelectorAll('.ovdot')].find(x=>x.dataset.k===ovSel);
  if(!g){box.hidden=true;popSig='';return}
  const hs=ovSel.split(',').map(id=>HIKES.find(h=>h.id===id)),sig=ovSel+U.us;
  if(sig!==popSig){popSig=sig;
    box.innerHTML=`<div class="poph"><b>${hs.length>1?hs.length+' hikes start here':'Start here'}</b><button type="button" class="popx" aria-label="Close">✕</button></div>`
      +hs.map(h=>{const d=DIFF(h);return `<a class="poprow" href="planner.html?r=${h.id}"><span class="pth"><img src="${h.cover}" alt=""><i class="${d}"></i></span>
        <span class="ptx"><b>${hikeName(h)}</b><span>${U.dist(h.km*1000)} · +${U.elev(h.up)} · ${hrs(h.moving+h.breaks)} · ${DIFF_NAME[d]}</span></span><span class="chev" aria-hidden="true">›</span></a>`}).join('')}
  box.hidden=false;
  // place it next to the dot, inside the map: above the dot in the lower half, below it in the upper half
  const mr=OVM.getBoundingClientRect(),cr=g.querySelector('circle').getBoundingClientRect(),W=OVM.clientWidth,H=OVM.clientHeight;
  const cx=cr.left+cr.width/2-mr.left,cy=cr.top+cr.height/2-mr.top,rad=cr.width/2+6,pw=Math.min(300,W-16);
  box.style.width=pw+'px';box.style.left=Math.max(8,Math.min(W-pw-8,cx-pw/2))+'px';
  if(cy>H/2){box.style.top='';box.style.bottom=(H-cy+rad)+'px';box.style.maxHeight=Math.max(90,cy-rad-8)+'px'}
  else{box.style.bottom='';box.style.top=(cy+rad)+'px';box.style.maxHeight=Math.max(90,H-cy-rad-8)+'px'}
}
$('ovpop').addEventListener('click',e=>{if(e.target.closest('.popx')){ovSel=null;ovPop();ovDraw()}});
// after a filter change: frame the hikes that match, so the change shows on the map
function ovFit(){
  const hs=HIKES.filter(h=>h.go&&passes(h));
  if(!hs.length||!FILTERS.some(f=>(FSEL[f.id]||[]).length)){ovAnimate(...ovHome());return}
  const w=OVM.clientWidth,h=OVM.clientHeight,ps=hs.map(x=>ovXY(x.go[1],x.go[0])),pad=56;
  const xs=ps.map(p=>p[0]),ys=ps.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const k=Math.min((w-2*pad)/Math.max(1,x1-x0),(h-2*pad)/Math.max(1,y1-y0)),z=Math.max(zMin(),Math.min(5,k*OV.W/w)),kk=w*z/OV.W;
  ovAnimate(z,w/2-(x0+x1)/2*kk,h/2-(y0+y1)/2*kk);
}
// pan and zoom: one transform on the image and its overlay; dots are redrawn so they keep their size on screen
let ovRaf=0;
function ovApply(redraw=true){
  const w=OVM.clientWidth,h=OVM.clientHeight;
  VIEW.z=Math.max(zMin(),Math.min(ZMAX,VIEW.z));
  VIEW.x=Math.min(0,Math.max(w-w*VIEW.z,VIEW.x));VIEW.y=Math.min(0,Math.max(h-w*VIEW.z*OV.H/OV.W,VIEW.y));
  OVI.style.transform=`translate(${VIEW.x}px,${VIEW.y}px) scale(${VIEW.z})`;
  const zm=zMin();
  $('ovminus').disabled=VIEW.z<=zm*1.001;$('ovplus').disabled=VIEW.z>=ZMAX-.001;
  if(redraw&&!ovRaf)ovRaf=requestAnimationFrame(()=>{ovRaf=0;ovDraw()});
}
function ovZoomAt(f,cx,cy){   // zoom by f about a point in the map box (screen px)
  const z0=VIEW.z,z1=Math.max(zMin(),Math.min(ZMAX,z0*f));
  VIEW.x=cx-(cx-VIEW.x)*z1/z0;VIEW.y=cy-(cy-VIEW.y)*z1/z0;VIEW.z=z1;ovApply();
}
function ovAnimate(z1,x1,y1){
  const z0=VIEW.z,x0=VIEW.x,y0=VIEW.y,t0=performance.now(),T=matchMedia('(prefers-reduced-motion: reduce)').matches?0:260;
  const step=t=>{const p=T?Math.min(1,(t-t0)/T):1,e=1-Math.pow(1-p,3);
    // interpolate in log zoom so the motion feels even
    VIEW.z=Math.exp(Math.log(z0)+(Math.log(z1)-Math.log(z0))*e);VIEW.x=x0+(x1-x0)*e;VIEW.y=y0+(y1-y0)*e;ovApply();if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function ovZoomBy(f,cx=OVM.clientWidth/2,cy=OVM.clientHeight/2){const z1=Math.max(zMin(),Math.min(ZMAX,VIEW.z*f));ovAnimate(z1,cx-(cx-VIEW.x)*z1/VIEW.z,cy-(cy-VIEW.y)*z1/VIEW.z)}
$('ovplus').addEventListener('click',()=>ovZoomBy(2));
$('ovminus').addEventListener('click',()=>ovZoomBy(.5));
$('ovreset').addEventListener('click',()=>ovAnimate(...ovHome()));
// pointers: one finger drags, two pinch; a quick second tap zooms in; a tap without movement stays a click
const PT=new Map();let gest=null,moved=false,lastTap=null,downDot=null;
const rel=e=>{const r=OVM.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
OVM.addEventListener('pointerdown',e=>{
  if(e.target.closest('.ovctl')||e.target.closest('.ovpop'))return;   // the buttons and the card take their own taps
  PT.set(e.pointerId,rel(e));if(PT.size===1){moved=false;downDot=e.target.closest('.ovdot')?.dataset.k??null}else downDot=null;
  try{OVM.setPointerCapture(e.pointerId)}catch(err){}
  gest=null;
});
OVM.addEventListener('pointermove',e=>{
  if(!PT.has(e.pointerId))return;
  const prev=PT.get(e.pointerId),cur=rel(e);PT.set(e.pointerId,cur);
  if(PT.size===1){
    if(!moved&&Math.hypot(cur[0]-(gest?.sx??prev[0]),cur[1]-(gest?.sy??prev[1]))<1)return;
    if(!gest)gest={sx:prev[0],sy:prev[1]};
    if(Math.hypot(cur[0]-gest.sx,cur[1]-gest.sy)>6)moved=true;
    if(moved){OVM.classList.add('drag');VIEW.x+=cur[0]-prev[0];VIEW.y+=cur[1]-prev[1];ovApply(false)}
  }else if(PT.size===2){
    const[a,b]=[...PT.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    if(!gest||!gest.d){gest={d,m};moved=true;return}
    VIEW.x+=m[0]-gest.m[0];VIEW.y+=m[1]-gest.m[1];gest.m=m;
    ovZoomAt(d/gest.d,m[0],m[1]);gest.d=d;
  }
});
const ptEnd=e=>{
  if(!PT.has(e.pointerId))return;const p=PT.get(e.pointerId);PT.delete(e.pointerId);
  if(!PT.size){OVM.classList.remove('drag');gest=null;ovApply();
    // a tap is handled here, not by click: the redraw above replaces the dot under the finger, so its click never comes
    if(!moved&&e.type==='pointerup'){
      if(downDot){ovTap(downDot);lastTap=null}
      else{if(ovSel){ovPick(null);ovDraw()}
        const now=Date.now();if(lastTap&&now-lastTap.t<320&&Math.hypot(p[0]-lastTap.p[0],p[1]-lastTap.p[1])<30){ovZoomBy(2,p[0],p[1]);lastTap=null}else lastTap={t:now,p}}}   // double tap on the map: zoom in there
    downDot=null;
  }else gest=null;
};
OVM.addEventListener('pointerup',ptEnd);OVM.addEventListener('pointercancel',ptEnd);
OVM.addEventListener('wheel',e=>{e.preventDefault();const[cx,cy]=rel(e);ovZoomAt(Math.exp(-e.deltaY*(e.deltaMode?0.05:0.0022)),cx,cy)},{passive:false});
OVM.addEventListener('dblclick',e=>e.preventDefault());
function ovTap(k){ovPick(k===ovSel?null:k);ovDraw()}
$('ovsvg').addEventListener('keydown',e=>{const g=e.target.closest('.ovdot');if((e.key==='Enter'||e.key===' ')&&g){e.preventDefault();ovTap(g.dataset.k)}});
$('ovimg').addEventListener('load',()=>{if(VMODE==='map'&&OVM.clientWidth){[VIEW.z,VIEW.x,VIEW.y]=ovHome();ovReady=true;ovApply()}});$('ovimg').src=OV.src;
addEventListener('resize',()=>{if(VMODE==='map')ovApply()});
drawFacets();setView(VMODE);

$('hctl').prepend(U.control(()=>{rowSig='';drawFacets();if(SHEET)drawSheet();renderRows();if(VMODE==='map')ovDraw()}));

const r=document.documentElement;
try{const th=localStorage.getItem('ench-theme');if(th)r.dataset.theme=th}catch(e){}
const isDark=()=>r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
$('theme').textContent=isDark()?'Light':'Dark';
$('theme').addEventListener('click',()=>{const d=isDark();r.dataset.theme=d?'light':'dark';$('theme').textContent=d?'Dark':'Light';
  try{localStorage.setItem('ench-theme',r.dataset.theme)}catch(e){}});

// offline: the service worker stores every route; say when that is done
const off=(k,t)=>{$('off').className='off '+k;$('off').innerHTML=t};
if(!window.isSecureContext||!('serviceWorker' in navigator))off('no','<b>This copy cannot store itself offline.</b> Open the published link in Chrome or Safari.');
else navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(()=>{
  // every file each route needs offline. The service worker stores them on install, but a download
  // that fails there is not retried; so the page checks, and fetches whatever is still missing itself.
  const NEED=[...new Set(['./planner.html','./sim.js','./units.js','./tags.js',OVERVIEW.src].concat(HIKES.flatMap(h=>h.assets.concat([h.cover,h.file]))).map(u=>u.startsWith('./')?u:'./'+u))];
  let tries=0;
  const check=async()=>{
    const have=await Promise.all(NEED.map(u=>caches.match(u,{ignoreSearch:true}).then(Boolean)));
    const miss=NEED.filter((u,i)=>!have[i]);
    if(!miss.length){off('ready','✓ Every route works offline');return}
    off('no',`<b>Saving routes for offline… ${NEED.length-miss.length} of ${NEED.length}</b> Stay on a connection.`);
    const name=(await caches.keys()).filter(k=>k.startsWith('hike-')).sort().pop()||'hike-page';
    const c=await caches.open(name),failed=[];
    for(const u of miss){try{const r=await fetch(u,{cache:'reload'});if(!r.ok)throw r.status;await c.put(u,r)}catch(e){failed.push(u)}}
    if(!failed.length){check();return}
    if(++tries<4){setTimeout(check,3000);return}
    off('no',`<b>${failed.length} file${failed.length>1?'s':''} could not be saved</b> (${failed.map(u=>u.split('/').pop()).slice(0,3).join(', ')}${failed.length>3?'…':''}). Check the connection and reload the page.`);
  };
  navigator.serviceWorker.ready.then(check);
}).catch(()=>off('no','<b>Not stored offline here.</b> Open the link in Chrome or Safari directly.'));
</script>
