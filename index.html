<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1C2A2E">
<link rel="apple-touch-icon" href="./cairns-apple-180.png">
<link rel="icon" type="image/png" href="./favicon.png">
<title>Cairns</title>
<script>
// links from the Enchantments-only version carried the plan in the hash: send them to that route
if(/(^|[#&])(d|c0)=/.test(location.hash))location.replace('planner.html?r=enchantments'+location.hash);
</script>
<script src="routes/catalog.js"></script>
<style>
:root{
  --bg:#E9ECE8; --panel:#F6F7F4; --ink:#1C2A2E; --muted:#5E6B67; --rule:#C9CFCA; --ok:#3C7A4E; --warn:#A86C12; --accent:#B0432A;
  --cond:"Avenir Next Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="dark"]{--bg:#12191B; --panel:#1A2326; --ink:#E4EAE6; --muted:#93A09B; --rule:#2E3A3D; --ok:#6DBB83; --warn:#E3A94B; --accent:#E77C64}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#12191B; --panel:#1A2326; --ink:#E4EAE6; --muted:#93A09B; --rule:#2E3A3D; --ok:#6DBB83; --warn:#E3A94B; --accent:#E77C64}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
h1{font:600 30px/1.05 var(--cond);margin:4px 0 2px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:56px;height:56px;object-fit:contain;}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
h2{font:600 21px/1.15 var(--cond);margin:22px 0 4px}
.peak{color:var(--muted);font-size:14px;margin:0 0 10px}
.ghost{background:none;border:1px solid var(--rule);border-radius:6px;padding:5px 10px;color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
a.card{display:block;color:inherit;text-decoration:none;background:var(--panel);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-bottom:4px}
.try{margin:0 0 14px;font-size:13px;color:var(--muted);text-align:right}.try a{color:var(--ink);font-weight:600}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cv{position:relative;aspect-ratio:16/8;background:#1C2A2E}
.cv img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.cv .t{position:absolute;inset:auto 0 0 0;padding:26px 12px 9px;color:#fff;background:linear-gradient(transparent,rgba(10,16,18,.85))}
.cv .t b{display:block;font:600 24px/1.05 var(--cond)}
.cv .t span{font:600 15px/1.2 var(--cond);opacity:.92}
.chip{position:absolute;top:10px;left:10px;border-radius:14px;padding:3px 10px;font:700 12px var(--body);letter-spacing:.03em;text-transform:uppercase;color:#fff;background:rgba(12,18,20,.7)}
.chip.Long{background:#3F4E75}.chip.Short{background:#B0432A}.chip.Medium{background:#3C7A4E}
.done{position:absolute;top:10px;right:10px;border-radius:14px;padding:3px 10px;font:600 12px var(--body);color:#fff;background:rgba(60,122,78,.9)}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px 12px 2px}
.st b{display:block;font:600 18px/1.1 var(--cond);font-variant-numeric:tabular-nums;white-space:nowrap}
.st span{font-size:11.5px;color:var(--muted)}
.bl{margin:6px 12px 4px;font-size:14px}
.cc{margin:0 12px 10px;font-size:11px;color:var(--muted)}
.fine{color:var(--muted);font-size:13px;margin-top:22px;border-top:1px solid var(--rule);padding-top:12px}
#off{border:1px solid var(--rule);border-radius:10px;padding:9px 12px;margin:0 0 6px;font-size:14px;background:var(--panel)}
#off.ready{border-color:var(--ok)} #off.no{border-color:var(--warn)}
.ov{background:var(--panel);border:1px solid var(--rule);border-radius:12px;margin:10px 0 4px;overflow:hidden}
.ov summary{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px;cursor:pointer;list-style:none;font:600 19px/1.1 var(--cond)}
.ov summary::-webkit-details-marker{display:none}
.ov summary::after{content:'Show';font:14px var(--body);color:var(--muted)}
.ov[open] summary::after{content:'Hide'}
.ov summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ovmap{overflow:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);overscroll-behavior:contain}
.ovin{position:relative;width:100%}
.ov.big .ovin{width:260%}
.ov.big .ovmap{max-height:62vh}
.ovin img{display:block;width:100%;height:auto}
:root[data-theme="dark"] .ovin img{filter:brightness(.72) saturate(.85)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ovin img{filter:brightness(.72) saturate(.85)}}
.ovin svg{position:absolute;inset:0;width:100%;height:100%}
.ovpl{font:600 13px var(--body);fill:var(--ink);stroke:var(--panel);stroke-width:3.5px;paint-order:stroke;pointer-events:none}
.ovdot{cursor:pointer}
.ovdot circle{stroke:#fff;stroke-width:2.5px}
.ovdot.Long circle{fill:#3F4E75}.ovdot.Short circle{fill:#B0432A}.ovdot.Medium circle{fill:#3C7A4E}.ovdot.Mixed circle{fill:#1C2A2E}
.ovdot.sel circle{stroke:var(--accent);stroke-width:4px}
.ovdot text{font:700 12px var(--body);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.ovdot .nm{font:600 13px var(--cond);fill:var(--ink);stroke:var(--panel);stroke-width:3.5px;paint-order:stroke;text-anchor:start}
.ovdot:focus-visible circle{stroke:var(--accent)}
.ovbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
.ovpick{display:flex;gap:10px;overflow-x:auto;padding:0 12px 12px}
.ovc{flex:0 0 220px;display:block;color:inherit;text-decoration:none;background:var(--bg);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.ovc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ovc img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;object-position:50% 30%;background:#1C2A2E}
.ovc b{display:block;font:600 17px/1.1 var(--cond);padding:7px 9px 0}
.ovc span{display:block;font-size:12.5px;color:var(--muted);padding:2px 9px 8px;font-variant-numeric:tabular-nums}
.credit{margin-top:24px;padding-top:12px;border-top:1px solid var(--rule);color:var(--muted);font-size:12.5px;text-align:center}
.credit a{color:inherit}
/* the logo in light ink on dark backgrounds */
.lg-dark{display:none}
.logo.lg-dark{width:77px;height:77px;margin:-10.5px}/* logo-dark.png has a 48px shadow margin on a 256px logo: scale 352/256 so the stones match */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-light{display:none}:root:not([data-theme="light"]) .lg-dark{display:inline}}
:root[data-theme="dark"] .lg-light{display:none}:root[data-theme="dark"] .lg-dark{display:inline}
</style>
</head>
<body>
<main>
<header>
  <div class="brand"><img class="logo lg-light" src="logo.png" alt="" width="56" height="56"><img class="logo lg-dark" src="logo-dark.png" alt="" width="56" height="56"><div><h1>Cairns</h1><p class="sub" style="margin:0">Hike planner</p></div></div>
  <button class="ghost" id="theme" type="button">Dark</button>
</header>
<p class="sub">Pick a route. Set the date, start time and forecast, and it times every stop, the turnaround and the finish. Works with no signal once opened.</p>
<div id="off">Checking offline copy…</div>
<details class="ov" id="ov" open><summary>Where the hikes are</summary>
  <div class="ovmap" id="ovmap"><div class="ovin"><img id="ovimg" alt="Relief map of the region from Puget Sound to Leavenworth, with a dot at each trailhead"><svg id="ovsvg" role="group" aria-label="Trailheads"></svg></div></div>
  <div class="ovbar"><span id="ovhint">Tap a dot to see the hikes that start there.</span><button class="ghost" id="ovzoom" type="button">Enlarge</button></div>
  <div class="ovpick" id="ovpick" hidden></div>
</details>
<div id="list"></div>
<footer class="credit">© 2026 · by El Loko Javi · <a href="https://github.com/ellokojavi/cairns" target="_blank" rel="noopener">GitHub</a></footer>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const dur=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
const n=v=>v.toLocaleString('en-US');
// one tap: Google Maps opens with driving directions to the parking (the app on a phone)
const gmaps=g=>'https://www.google.com/maps/dir/?api=1&destination='+g[0]+','+g[1]+'&travelmode=driving';
function card(h,multi){
  return `<a class="card" href="planner.html?r=${h.id}">
    <div class="cv"><img src="${h.cover}" alt="" loading="lazy"><span class="chip ${h.size}">${h.size}</span>${h.done?`<span class="done">${h.done}</span>`:''}
      <div class="t"><b>${multi?h.title+': '+h.variant:h.title}</b><span>${multi?h.type:h.variant+' · '+h.type}</span></div></div>
    <div class="st"><div><b>${h.km} km</b><span>distance</span></div><div><b>+${n(h.up)} m</b><span>climb</span></div>
      <div><b>${n(h.hi)} m</b><span>high point</span></div><div><b>${dur(h.moving)}</b><span>moving</span></div></div>
    <p class="bl">${h.blurb}</p>${h.coverCredit?`<p class="cc">Cover: ${h.coverCredit[0]}</p>`:''}</a>
    <p class="try">${h.go?`<a href="${gmaps(h.go)}" target="_blank" rel="noopener">Directions to the trailhead</a> · `:''}<a href="planner.html?r=${h.id}&amp;sim=1">Rehearse it in test mode</a></p>`;
}
// routes on the same peak sit together
const groups=[];HIKES.forEach(h=>{let g=groups.find(g=>g.peak===h.peak);if(!g)groups.push(g={peak:h.peak,list:[]});g.list.push(h)});
$('list').innerHTML=groups.map(g=>{
  let s=`<h2>${g.peak}</h2><p class="peak">${g.list[0].place}</p>`;
  return s+g.list.map(h=>card(h,g.list.length>1)).join('');
}).join('');

// ---------- overview map: a dot per trailhead; dots too close to tell apart on screen merge ----------
// Filter layers (length, climb, time…) go in OV_FILTERS: each is h=>true|false, and the map shows
// only the hikes that pass all of them.
const OV=OVERVIEW,OV_FILTERS=[];
const ovShown=()=>HIKES.filter(h=>h.go&&OV_FILTERS.every(f=>f(h)));
const ovXY=(lon,lat)=>[(lon-OV.w)/(OV.e-OV.w)*OV.W,(OV.n-lat)/(OV.n-OV.s)*OV.H];
let ovSel=null;
function ovCard(h){return `<a class="ovc" href="planner.html?r=${h.id}"><img src="${h.cover}" alt="" loading="lazy"><b>${h.title}</b>
  <span>${h.variant} · ${h.km} km · +${n(h.up)} m · ${dur(h.moving)} moving</span></a>`}
function ovDraw(){
  const svg=$('ovsvg'),k=svg.getBoundingClientRect().width/OV.W||.3;   // screen px per map px
  svg.setAttribute('viewBox',`0 0 ${OV.W} ${OV.H}`);
  const u=v=>(v/k).toFixed(1);   // a size in screen px, in map units
  // one point per trailhead, then merge points closer than ~26 px on screen
  const pts=[];ovShown().forEach(h=>{const[x,y]=ovXY(h.go[1],h.go[0]);let p=pts.find(p=>Math.hypot(p.x-x,p.y-y)<1);if(!p)pts.push(p={x,y,hs:[]});p.hs.push(h)});
  const cl=pts.map(p=>({x:p.x,y:p.y,hs:p.hs.slice()}));
  for(;;){let best=null;   // merge the closest pair first, so a trailhead joins its true neighbour
    for(let i=0;i<cl.length;i++)for(let j=i+1;j<cl.length;j++){const d=Math.hypot(cl[i].x-cl[j].x,cl[i].y-cl[j].y)*k;if(d<26&&(!best||d<best[0]))best=[d,i,j]}
    if(!best)break;const[,i,j]=best,a=cl[i],c=cl[j],nn=a.hs.length+c.hs.length;
    a.x=(a.x*a.hs.length+c.x*c.hs.length)/nn;a.y=(a.y*a.hs.length+c.y*c.hs.length)/nn;a.hs.push(...c.hs);cl.splice(j,1)}
  // towns: the small ones only on the enlarged map; a name that would sit on a dot moves below it
  const places=OV.places.filter(p=>!p[3]||k>.5).map(([t,lo,la])=>{const[x,y]=ovXY(lo,la);
    const tw=t.length*3.5,near=cl.some(c=>{const nw=k>.5?c.hs[0].peak.length*7+90:0;   // the dot, and its name to the right when enlarged
      return (x-c.x)*k<12+nw+tw&&(c.x-x)*k<12+tw&&Math.abs(c.y-y)*k<16}),yy=near?y+22/k:y;
    const anchor=x*k<t.length*3.5+4?'start':(OV.W-x)*k<t.length*3.5+4?'end':'middle';
    return `<text class="ovpl" x="${x}" y="${yy}" style="font-size:${u(12)}px;stroke-width:${u(3.5)}px" text-anchor="${anchor}">${t}</text>`}).join('');
  const dots=cl.map((c,i)=>{const sizes=[...new Set(c.hs.map(h=>h.size))],cls=sizes.length>1?'Mixed':sizes[0];
    const key=c.hs.map(h=>h.id).join(','),r=c.hs.length>1?11:8;
    const pk=[...new Set(c.hs.map(h=>h.peak))],name=pk.length>2?`${pk[0]} +${pk.length-1} more`:pk.join(', ');
    return `<g class="ovdot ${cls}${ovSel===key?' sel':''}" data-k="${key}" tabindex="0" role="button" aria-label="${name}: ${c.hs.length} hike${c.hs.length>1?'s':''}">
      <circle cx="${c.x}" cy="${c.y}" r="${u(r)}" style="stroke-width:${u(ovSel===key?4:2.5)}px"></circle>${c.hs.length>1?`<text x="${c.x}" y="${c.y}" style="font-size:${u(12)}px">${c.hs.length}</text>`:''}
      ${k>.5?`<text class="nm" x="${c.x+(r+5)/k}" y="${c.y}" style="font-size:${u(13)}px;stroke-width:${u(3.5)}px">${name}</text>`:''}</g>`}).join('');
  svg.innerHTML=places+dots;
  // the picked dot may have merged or split after a zoom: keep showing its hikes if they are still on the map
  if(ovSel){const g=[...svg.querySelectorAll('.ovdot')].find(g=>g.dataset.k.split(',').some(id=>ovSel.split(',').includes(id)));
    if(g){ovSel=g.dataset.k;g.classList.add('sel');ovPick(ovSel)}else ovPick(null)}
}
function ovPick(key){
  ovSel=key;const box=$('ovpick');
  if(!key){box.hidden=true;$('ovhint').textContent='Tap a dot to see the hikes that start there.';return}
  const hs=key.split(',').map(id=>HIKES.find(h=>h.id===id));
  box.innerHTML=hs.map(ovCard).join('');box.hidden=false;
  $('ovhint').textContent=hs.length>1?`${hs.length} hikes here. Tap one to plan it.`:'Tap the card to plan it.';
}
$('ovsvg').addEventListener('click',e=>{const g=e.target.closest('.ovdot');const k=g?g.dataset.k:null;ovPick(k===ovSel?null:k);ovDraw()});
$('ovsvg').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('.ovdot')){e.preventDefault();e.target.closest('.ovdot').dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
$('ovzoom').addEventListener('click',()=>{const big=$('ov').classList.toggle('big');$('ovzoom').textContent=big?'Fit':'Enlarge';
  requestAnimationFrame(()=>{ovDraw();const m=$('ovmap');
    // centre the enlarged map on the picked dot, or on the cluster of hikes east of Seattle
    const g=m.querySelector('.ovdot.sel circle'),[cx,cy]=g?[+g.getAttribute('cx'),+g.getAttribute('cy')]:ovXY(-121.75,47.55),k=m.scrollWidth/OV.W;
    m.scrollLeft=cx*k-m.clientWidth/2;m.scrollTop=cy*k-m.clientHeight/2})});
$('ov').addEventListener('toggle',()=>{try{localStorage.setItem('cairns-map',$('ov').open?'open':'closed')}catch(e){}if($('ov').open)ovDraw()});
try{if(localStorage.getItem('cairns-map')==='closed')$('ov').open=false}catch(e){}
$('ovimg').addEventListener('load',ovDraw);$('ovimg').src=OV.src;
addEventListener('resize',ovDraw);

const r=document.documentElement;
try{const th=localStorage.getItem('ench-theme');if(th)r.dataset.theme=th}catch(e){}
const isDark=()=>r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
$('theme').textContent=isDark()?'Light':'Dark';
$('theme').addEventListener('click',()=>{const d=isDark();r.dataset.theme=d?'light':'dark';$('theme').textContent=d?'Dark':'Light';
  try{localStorage.setItem('ench-theme',r.dataset.theme)}catch(e){}});

// offline: the service worker stores every route; say when that is done
const off=(k,t)=>{$('off').className=k;$('off').innerHTML=t};
if(!window.isSecureContext||!('serviceWorker' in navigator))off('no','<b>This copy cannot store itself offline.</b> Open the published link in Chrome or Safari.');
else navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(()=>{
  // every file each route needs offline. The service worker stores them on install, but a download
  // that fails there is not retried; so the page checks, and fetches whatever is still missing itself.
  const NEED=[...new Set(['./planner.html','./sim.js',OVERVIEW.src].concat(HIKES.flatMap(h=>h.assets.concat([h.cover,h.file]))).map(u=>u.startsWith('./')?u:'./'+u))];
  let tries=0;
  const check=async()=>{
    const have=await Promise.all(NEED.map(u=>caches.match(u,{ignoreSearch:true}).then(Boolean)));
    const miss=NEED.filter((u,i)=>!have[i]);
    if(!miss.length){off('ready','<b>Every route works in Airplane mode.</b> Add this page to your home screen to open it without the link.');return}
    off('no',`<b>Saving routes for offline… ${NEED.length-miss.length} of ${NEED.length}</b> Stay on a connection.`);
    const name=(await caches.keys()).filter(k=>k.startsWith('hike-')).sort().pop()||'hike-page';
    const c=await caches.open(name),failed=[];
    for(const u of miss){try{const r=await fetch(u,{cache:'reload'});if(!r.ok)throw r.status;await c.put(u,r)}catch(e){failed.push(u)}}
    if(!failed.length){check();return}
    if(++tries<4){setTimeout(check,3000);return}
    off('no',`<b>${failed.length} file${failed.length>1?'s':''} could not be saved</b> (${failed.map(u=>u.split('/').pop()).slice(0,3).join(', ')}${failed.length>3?'…':''}). Check the connection and reload the page.`);
  };
  navigator.serviceWorker.ready.then(check);
}).catch(()=>off('no','<b>Not stored offline here.</b> Open the link in Chrome or Safari directly.'));
</script>
</body>
</html>
